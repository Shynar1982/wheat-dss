services:
  db:
    image: postgis/postgis:16-3.4
    network_mode: "host"
    environment:
      POSTGRES_USER: wheat
      POSTGRES_PASSWORD: wheat
      POSTGRES_DB: wheat_dss
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wheat -d wheat_dss"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    network_mode: "host"
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./app:/code/app
      - ./alembic:/code/alembic
      - ./alembic.ini:/code/alembic.ini

volumes:
  pgdata:
