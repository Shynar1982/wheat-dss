<!DOCTYPE html>
<html lang='ru'>
<head>
    <meta charset='UTF-8'>
    <title>Wheat DSS</title>
    <script src='https://cdn.jsdelivr.net/npm/chart.js'></script>
    <style>
        body { font-family: Arial; background: #f4f4f9; padding: 20px; }
        .container { max-width: 900px; margin: auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        select { padding: 8px; font-size: 16px; border-radius: 5px; border: 1px solid #ccc; }
        .grid { display: flex; gap: 20px; }
        .card { flex: 1; background: #ecf0f1; padding: 15px; border-radius: 8px; }
        .highlight { font-size: 24px; font-weight: bold; color: #e74c3c; text-align: center; }
        .rec-text { font-style: italic; color: #27ae60; }
    </style>
</head>
<body>
    <div class='container'>
        <div class='header'>
            <h1>Wheat DSS</h1>
            <select id='field-select' onchange='loadData(this.value)'>
                <option value=''>Загрузка полей...</option>
            </select>
        </div>

        <div class='grid'>
            <div class='card'>
                <h3>Прогноз урожайности</h3>
                <div class='highlight' id='yield-value'>-</div>
            </div>
            <div class='card'>
                <h3>Рекомендация</h3>
                <p class='rec-text' id='rec-text'>-</p>
            </div>
        </div>
        <div class='card' style='margin-top: 20px;'>
            <h3>Динамика NDVI (Спутник Sentinel-2)</h3>
            <canvas id='ndviChart'></canvas>
        </div>
    </div>
    <script>
        let myChart = null;

        async function loadFields() {
            const select = document.getElementById('field-select');
            try {
                const res = await fetch('/api/all-fields');
                const fields = await res.json();
                select.innerHTML = '';
                
                fields.forEach(field => {
                    const option = document.createElement('option');
                    option.value = field.field_id;
                    option.textContent = ;
                    select.appendChild(option);
                });
                
                if (fields.length > 0) loadData(fields[0].field_id);
            } catch (error) {
                select.innerHTML = '<option>Ошибка загрузки полей</option>';
            }
        }

        async function loadData(fieldId) {
            document.getElementById('yield-value').innerText = 'Загрузка...';
            document.getElementById('rec-text').innerText = 'Загрузка...';
            if (myChart) { myChart.destroy(); myChart = null; }

            // 1. Прогноз
            try {
                const res = await fetch();
                const data = await res.json();
                if (data && data.length > 0) {
                    document.getElementById('yield-value').innerText = data[0].predicted_yield_t_ha + ' т/га';
                } else {
                    document.getElementById('yield-value').innerText = 'Нет прогноза';
                }
            } catch (e) { document.getElementById('yield-value').innerText = 'Нет данных'; }

            // 2. Рекомендации
            try {
                const res = await fetch();
                const data = await res.json();
                document.getElementById('rec-text').innerText = (data && data.length > 0) ? data[0].message_text : 'Нет рекомендаций';
            } catch (e) { document.getElementById('rec-text').innerText = 'Нет данных'; }

            // 3. NDVI (график)
            try {
                const res = await fetch();
                const ndviData = await res.json();
                
                if (ndviData && ndviData.length > 0) {
                    const ctx = document.getElementById('ndviChart').getContext('2d');
                    myChart = new Chart(ctx, {
                        type: 'line',
                        data: {
                            labels: ndviData.map(d => d.observed_at),
                            datasets: [{ label: 'NDVI', data: ndviData.map(d => d.ndvi), borderColor: '#2ecc71', backgroundColor: 'rgba(46, 204, 113, 0.2)', fill: true }]
                        },
                        options: { responsive: true }
                    });
                }
            } catch (e) { console.log('Нет данных NDVI'); }
        }
        document.addEventListener('DOMContentLoaded', loadFields);
    </script>
</body>
</html>
