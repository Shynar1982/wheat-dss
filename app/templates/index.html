<!DOCTYPE html>
<html lang='ru'>
<head>
    <meta charset='UTF-8'>
    <title>Wheat DSS</title>
    <script src='https://cdn.jsdelivr.net/npm/chart.js'></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f4f9; padding: 20px; margin: 0; }
        .container { max-width: 1100px; margin: auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .header h1 { margin: 0; font-size: 28px; }
        .controls { display: flex; gap: 10px; align-items: center; }
        select { padding: 10px; font-size: 16px; border-radius: 5px; border: 1px solid #ccc; cursor: pointer; }
        
        /* Стили для кнопки */
        button { padding: 10px 20px; font-size: 16px; font-weight: bold; color: white; background: #3498db; border: none; border-radius: 5px; cursor: pointer; transition: 0.3s; }
        button:hover { background: #2980b9; }
        button:disabled { background: #95a5a6; cursor: not-allowed; }

        .metrics-bar { display: flex; gap: 20px; background: #2c3e50; color: white; padding: 15px 20px; border-radius: 8px; margin-bottom: 20px; }
        .metric-item { flex: 1; text-align: center; }
        .metric-value { font-size: 20px; font-weight: bold; color: #2ecc71; }

        .grid { display: flex; gap: 20px; margin-bottom: 20px; }
        .card { flex: 1; background: #ecf0f1; padding: 20px; border-radius: 8px; }
        .card h3 { margin-top: 0; font-size: 16px; color: #333; }
        .highlight { font-size: 24px; font-weight: bold; color: #e74c3c; text-align: center; margin-top: 10px; }
        .rec-text { font-style: italic; color: #27ae60; margin-top: 10px; }
        
        .chart-container { background: #ecf0f1; padding: 20px; border-radius: 8px; margin-bottom: 20px; }
        #map { height: 400px; width: 100%; border-radius: 8px; margin-top: 10px; z-index: 1; }
        .charts-row { display: flex; gap: 20px; }
        .chart-half { flex: 1; background: #ecf0f1; padding: 20px; border-radius: 8px; }
    </style>
</head>
<body>
    <div class='container'>
        <div class='metrics-bar' id="metrics-panel">
            <div class="metric-item">Точность модели (R²): <span class="metric-value" id="metric-r2">...</span></div>
            <div class="metric-item">Ошибка (RMSE): <span class="metric-value" id="metric-rmse">...</span> т/га</div>
            <div class="metric-item">Ср. ошибка (MAE): <span class="metric-value" id="metric-mae">...</span> т/га</div>
        </div>

        <div class='header'>
            <h1>Wheat DSS</h1>
            <div class="controls">
                <select id='field-select' onchange='loadData(this.value)'>
                    <option value=''>Загрузка полей...</option>
                </select>
                <!-- Новая кнопка -->
                <button id="predict-btn" onclick="runPrediction()">Запустить модель (Predict)</button>
            </div>
        </div>

        <div class='grid'>
            <div class='card'>
                <h3>Прогноз урожайности</h3>
                <div class='highlight' id='yield-value'>-</div>
            </div>
            <div class='card'>
                <h3>Рекомендация</h3>
                <div class='rec-text' id='rec-text'>-</div>
            </div>
        </div>
        
        <div class='chart-container'>
            <h3>Контур поля на карте</h3>
            <div id='map'></div>
        </div>

        <div class='charts-row'>
            <div class='chart-half'>
                <h3>Динамика NDVI (Sentinel-2)</h3>
                <canvas id='ndviChart' style="max-height: 250px;"></canvas>
            </div>
            <div class='chart-half'>
                <h3>Вклад факторов в прогноз (Feature Importance)</h3>
                <canvas id='featureChart' style="max-height: 250px;"></canvas>
            </div>
        </div>
    </div>

    <script>
        let myChart = null;
        let featureChart = null;
        let allFieldsData = [];
        let currentFieldLayer = null;
        let currentFieldId = null;

        const map = L.map('map').setView([52.0, 66.0], 6); 
        L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}').addTo(map);

        async function loadModelMetrics() {
            try {
                const res = await fetch('/api/model-metrics');
                const data = await res.json();
                document.getElementById('metric-r2').innerText = data.metrics.r2;
                document.getElementById('metric-rmse').innerText = data.metrics.rmse;
                document.getElementById('metric-mae').innerText = data.metrics.mae;

                const ctx = document.getElementById('featureChart').getContext('2d');
                featureChart = new Chart(ctx, {
                    type: 'bar',
                    data: {
                        labels: data.features.map(f => f.name),
                        datasets: [{ label: 'Важность (%)', data: data.features.map(f => f.importance), backgroundColor: ['#3498db', '#2980b9', '#1abc9c', '#16a085', '#95a5a6'], borderRadius: 5 }]
                    },
                    options: { indexAxis: 'y', responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { x: { beginAtZero: true, max: 50 } } }
                });
            } catch (e) { console.error("Ошибка метрик:", e); }
        }

        async function loadFields() {
            const select = document.getElementById('field-select');
            try {
                const res = await fetch('/api/all-fields');
                const fields = await res.json();
                allFieldsData = fields;
                select.innerHTML = '';
                fields.forEach(field => {
                    const option = document.createElement('option');
                    option.value = field.field_id;
                    option.textContent = `Поле №${field.field_id} (${field.name})`;
                    select.appendChild(option);
                });
                if (fields.length > 0) loadData(fields[0].field_id);
            } catch (error) {
                select.innerHTML = '<option>Ошибка загрузки полей</option>';
            }
        }

        // НОВАЯ ФУНКЦИЯ ДЛЯ ЗАПУСКА МОДЕЛИ
        async function runPrediction() {
            if (!currentFieldId) return;
            const btn = document.getElementById('predict-btn');
            const yieldText = document.getElementById('yield-value');
            
            // Блокируем кнопку и меняем текст, пока модель считает
            btn.disabled = true;
            btn.innerText = 'Расчет...';
            yieldText.innerText = 'Расчет модели...';

            try {
                // Делаем POST-запрос к вашему API
                const res = await fetch(`/v1/fields/${currentFieldId}/yield/predict`, { method: 'POST' });
                if (!res.ok) throw new Error('Ошибка сервера');
                
                // После успешного пересчета, обновляем данные на экране
                await loadData(currentFieldId); 
            } catch (e) {
                alert('Не удалось запустить модель. Проверьте логи бэкенда.');
                yieldText.innerText = 'Ошибка';
            } finally {
                // Возвращаем кнопку в исходное состояние
                btn.disabled = false;
                btn.innerText = 'Запустить модель (Predict)';
            }
        }

        async function loadData(fieldId) {
            if (!fieldId) return;
            currentFieldId = fieldId;
            
            document.getElementById('yield-value').innerText = 'Загрузка...';
            document.getElementById('rec-text').innerText = 'Загрузка...';
            if (myChart) { myChart.destroy(); myChart = null; }

            const fieldInfo = allFieldsData.find(f => String(f.field_id) === String(fieldId));
            if (fieldInfo && fieldInfo.geom) {
                if (currentFieldLayer) map.removeLayer(currentFieldLayer);
                try {
                    const geojsonObj = JSON.parse(fieldInfo.geom);
                    currentFieldLayer = L.geoJSON(geojsonObj, {
                        style: { color: '#e74c3c', weight: 3, fillColor: '#e74c3c', fillOpacity: 0.3 }
                    }).addTo(map);
                    map.fitBounds(currentFieldLayer.getBounds(), { padding: [20, 20] }); 
                } catch(e) { console.error("Ошибка карты:", e); }
            }

            try {
                const res = await fetch(`/v1/fields/${fieldId}/yield/predictions`);
                const data = await res.json();
                document.getElementById('yield-value').innerText = (data && data.length > 0) ? data[0].predicted_yield_t_ha + ' т/га' : 'Нет прогноза';
            } catch (e) { document.getElementById('yield-value').innerText = 'Нет данных'; }

            try {
                const res = await fetch(`/v1/fields/${fieldId}/recommendations`);
                const data = await res.json();
                document.getElementById('rec-text').innerText = (data && data.length > 0) ? data[0].message_text : 'Нет рекомендаций';
            } catch (e) { document.getElementById('rec-text').innerText = 'Нет данных'; }

            try {
                const res = await fetch(`/v1/fields/${fieldId}/indices`);
                const ndviData = await res.json();
                if (ndviData && ndviData.length > 0) {
                    const ctx = document.getElementById('ndviChart').getContext('2d');
                    myChart = new Chart(ctx, {
                        type: 'line',
                        data: {
                            labels: ndviData.map(d => d.observed_at),
                            datasets: [{ label: 'NDVI', data: ndviData.map(d => d.ndvi), borderColor: '#2ecc71', backgroundColor: 'rgba(46, 204, 113, 0.2)', fill: true, tension: 0.3 }]
                        },
                        options: { responsive: true, maintainAspectRatio: false, scales: { y: { beginAtZero: true, max: 1 } } }
                    });
                }
            } catch (e) { console.log('Нет данных NDVI'); }
        }

        document.addEventListener('DOMContentLoaded', () => {
            loadModelMetrics();
            loadFields();
        });
    </script>
</body>
</html>
