<!DOCTYPE html>
<html lang='ru'>
<head>
    <meta charset='UTF-8'>
    <title>Wheat DSS</title>
    <script src='https://cdn.jsdelivr.net/npm/chart.js'></script>
    <style>
        body { font-family: Arial; background: #f4f4f9; padding: 20px; }
        .container { max-width: 900px; margin: auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        select { padding: 8px; font-size: 16px; border-radius: 5px; border: 1px solid #ccc; }
        .grid { display: flex; gap: 20px; }
        .card { flex: 1; background: #ecf0f1; padding: 15px; border-radius: 8px; }
        .highlight { font-size: 24px; font-weight: bold; color: #e74c3c; text-align: center; }
        .rec-text { font-style: italic; color: #27ae60; }
    </style>
</head>
<body>
    <div class='container'>
        <div class='header'>
            <h1>Wheat DSS</h1>
            <select id='field-select' onchange='loadData(this.value)'>
                <option value=''>Загрузка полей...</option>
            </select>
        </div>

        <div class='grid'>
            <div class='card'>
                <h3>Прогноз урожайности</h3>
                <div class='highlight' id='yield-value'>Загрузка...</div>
            </div>
            <div class='card'>
                <h3>Рекомендация</h3>
                <p class='rec-text' id='rec-text'>Загрузка...</p>
            </div>
        </div>
        <div class='card' style='margin-top: 20px;'>
            <h3>Динамика NDVI (Спутник Sentinel-2)</h3>
            <canvas id='ndviChart'></canvas>
        </div>
    </div>
    <script>
        let myChart = null;

        async function loadFields() {
            const select = document.getElementById('field-select');
            try {
                // Относительный путь работает от того порта, на котором открыта страница
                const res = await fetch('/api/all-fields');
                if (!res.ok) throw new Error(`Ошибка сервера: ${res.status}`);
                
                const fields = await res.json();
                select.innerHTML = ''; // Очищаем
                
                if (fields.length === 0) {
                    select.innerHTML = '<option>В базе нет полей</option>';
                    return;
                }

                fields.forEach(field => {
                    const option = document.createElement('option');
                    option.value = field.field_id; // Берем field_id!
                    option.textContent = `Поле №${field.field_id} (${field.name})`;
                    select.appendChild(option);
                });
                
                // Загружаем данные для первого поля
                loadData(fields[0].field_id);
            } catch (error) {
                console.error(error);
                // Выводим ошибку прямо на экран
                select.innerHTML = `<option>Ошибка API: ${error.message}</option>`;
            }
        }

        async function loadData(fieldId) {
            if (!fieldId) return;
            document.getElementById('yield-value').innerText = 'Загрузка...';
            document.getElementById('rec-text').innerText = 'Загрузка...';

            try {
                const yieldRes = await fetch(`/v1/fields/${fieldId}/yield/predictions`);
                const yieldData = await yieldRes.json();
                document.getElementById('yield-value').innerText = yieldData.length > 0 ? yieldData[0].predicted_yield_t_ha + ' т/га' : 'Нет данных';

                const recRes = await fetch(`/v1/fields/${fieldId}/recommendations`);
                const recData = await recRes.json();
                document.getElementById('rec-text').innerText = recData.length > 0 ? recData[0].message_text : 'Нет рекомендаций';

                const ndviRes = await fetch(`/v1/fields/${fieldId}/indices`);
                const ndviData = await ndviRes.json();
                
                const ctx = document.getElementById('ndviChart').getContext('2d');
                if (myChart) myChart.destroy();

                myChart = new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: ndviData.map(d => d.observed_at),
                        datasets: [{ label: 'NDVI', data: ndviData.map(d => d.ndvi), borderColor: '#2ecc71', backgroundColor: 'rgba(46, 204, 113, 0.2)', fill: true }]
                    },
                    options: { responsive: true }
                });
            } catch (e) {
                console.error(e);
                document.getElementById('yield-value').innerText = 'Ошибка';
            }
        }

        document.addEventListener('DOMContentLoaded', loadFields);
    </script>
</body>
</html>
