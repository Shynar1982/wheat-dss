[alembic]
script_location = alembic
sqlalchemy.url = postgresql+psycopg2://wheat:wheat@127.0.0.1:5432/wheat_dss

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %(levelname)s %(message)s
